name: Deploy to GitHub Pages

on:
  # Publish on every push to the default branch...
  push:
    branches: [main]
  # ...and allow manual runs from the Actions tab.
  workflow_dispatch:
  # ...and once a day, so the GPU spot prices on the page stay current.
  schedule:
    - cron: "17 5 * * *"

# Least-privilege token scoped for Pages deployment via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies to install: the scripts use only Node built-ins.
      # GPU spot prices are fetched live at deploy time from a public, keyless API.
      # If the fetch fails, the build falls back to the committed data/gpu-spot.json.
      - name: Refresh GPU spot prices
        run: npm run scrape:gpu
        continue-on-error: true

      # Rebuilds dist/index.html from data/*.json so the deployed page always
      # reflects the latest figures.
      - name: Build static page
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
